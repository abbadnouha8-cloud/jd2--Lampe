<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background and Ring Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071830" />
      <stop offset="50%" stop-color="#0b2545" />
      <stop offset="100%" stop-color="#13315c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00a3ff" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.4" />
    </linearGradient>

    <!-- Circular paths for arched text -->
    <!-- Top arc for Lab name -->
    <path id="topTextArc" d="M 55,200 A 145,145 0 1,1 345,200" fill="none" />
    <!-- Bottom arc for UIT -->
    <path id="bottomTextArc" d="M 342,200 A 142,142 0 0,1 58,200" fill="none" />
  </defs>

  <!-- Outer Drop Shadow Circle -->
  <circle cx="200" cy="200" r="194" fill="#030b18" opacity="0.25" />

  <!-- Outer Outer Border -->
  <circle cx="200" cy="200" r="192" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Outer Ring Inset -->
  <circle cx="200" cy="200" r="182" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6" />

  <!-- Text Ring Band -->
  <circle cx="200" cy="200" r="150" fill="#06162a" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Arched Text Top: LABORATOIRE DES MATÉRIAUX AVANCÉS ET DE GÉNIE DES PROCÉDÉS -->
  <text font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="11.5" fill="#ffffff" letter-spacing="1.4">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      LABORATOIRE DES MATÉRIAUX AVANCÉS &amp; GÉNIE DES PROCÉDÉS
    </textPath>
  </text>

  <!-- Arched Text Bottom: UNIVERSITÉ IBN TOFAÏL • KÉNITRA -->
  <text font-family="'Montserrat', 'Arial', sans-serif" font-weight="700" font-size="11" fill="#fcd34d" letter-spacing="2.2">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      ★ UNIVERSITÉ IBN TOFAÏL • FSK • KÉNITRA ★
    </textPath>
  </text>

  <!-- Inner Center Medallion -->
  <circle cx="200" cy="200" r="130" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" />
  <circle cx="200" cy="200" r="126" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- Subtle Radial Grid / Coordinate Lines -->
  <line x1="120" y1="200" x2="280" y2="200" stroke="#00a3ff" stroke-width="0.8" opacity="0.2" stroke-dasharray="2,2" />
  <line x1="200" y1="120" x2="200" y2="280" stroke="#00a3ff" stroke-width="0.8" opacity="0.2" stroke-dasharray="2,2" />

  <!-- Scientific Orbiting Rings (Materials / Chemistry Symbolism) -->
  <ellipse cx="200" cy="192" rx="72" ry="24" fill="none" stroke="#38bdf8" stroke-width="1.8" transform="rotate(-28 200 192)" opacity="0.55" />
  <ellipse cx="200" cy="192" rx="72" ry="24" fill="none" stroke="#f5a623" stroke-width="1.8" transform="rotate(28 200 192)" opacity="0.55" />

  <!-- Electrons / Atoms on Orbits -->
  <circle cx="140" cy="160" r="3.5" fill="#fcd34d" />
  <circle cx="260" cy="224" r="3.5" fill="#fcd34d" />
  <circle cx="258" cy="162" r="3.5" fill="#38bdf8" />
  <circle cx="142" cy="222" r="3.5" fill="#38bdf8" />

  <!-- LABORATORY GLASSWARE -->
  <!-- 1. Left: Graduated Measuring Beaker -->
  <g transform="translate(132, 160)">
    <!-- Beaker Body -->
    <path d="M 4,0 L 36,0 L 34,42 Q 33,45 28,45 L 12,45 Q 7,45 6,42 Z" fill="rgba(255,255,255,0.08)" stroke="#93c5fd" stroke-width="2" stroke-linejoin="round" />
    <!-- Beaker Lip Spout -->
    <path d="M 4,0 L 0,-2" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
    <!-- Liquid in Beaker -->
    <path d="M 6.5,22 Q 20,24 33.5,22 L 32,41 Q 31,43.5 27,43.5 L 13,43.5 Q 9,43.5 8,41 Z" fill="url(#liquidGrad)" opacity="0.8" />
    <!-- Graduation Marks -->
    <line x1="8" y1="12" x2="16" y2="12" stroke="#ffffff" stroke-width="1.2" opacity="0.7" />
    <line x1="8" y1="20" x2="14" y2="20" stroke="#ffffff" stroke-width="1.2" opacity="0.7" />
    <line x1="8" y1="28" x2="17" y2="28" stroke="#ffffff" stroke-width="1.2" opacity="0.7" />
    <line x1="8" y1="36" x2="14" y2="36" stroke="#ffffff" stroke-width="1.2" opacity="0.7" />
  </g>

  <!-- 2. Right: Round-Bottom Flask / Boiling Flask with Condenser Neck -->
  <g transform="translate(228, 150)">
    <!-- Neck -->
    <rect x="14" y="0" width="10" height="22" rx="1.5" fill="rgba(255,255,255,0.08)" stroke="#93c5fd" stroke-width="2" />
    <!-- Top Lip -->
    <path d="M 11,0 L 27,0" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
    <!-- Spherical Bulb -->
    <path d="M 14,21 C 2,24 -2,46 10,54 C 20,60 36,54 38,38 C 40,26 26,22 24,21 Z" fill="rgba(255,255,255,0.08)" stroke="#93c5fd" stroke-width="2" />
    <!-- Liquid in Bulb -->
    <path d="M 4,38 Q 20,41 36,37 C 37,45 32,53 23,54 C 13,54 5,47 4,38 Z" fill="url(#goldGrad)" opacity="0.85" />
    <!-- Rising Bubbles -->
    <circle cx="16" cy="30" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="22" cy="22" r="1.5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- 3. Centerpiece: Conical Erlenmeyer Flask -->
  <g transform="translate(176, 126)">
    <!-- Liquid Inside Flask (rendered first so glass overlay shines) -->
    <path d="M 6.5,50 Q 24,53 41.5,50 L 46,72 Q 46.5,76 41,76 L 7,76 Q 1.5,76 2,72 Z" fill="url(#liquidGrad)" />
    <!-- Liquid Meniscus Highlight -->
    <path d="M 6.5,50 Q 24,53 41.5,50" stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.9" />

    <!-- Bubbles in Liquid -->
    <circle cx="16" cy="62" r="2.5" fill="#ffffff" opacity="0.75" />
    <circle cx="31" cy="66" r="1.8" fill="#ffffff" opacity="0.75" />
    <circle cx="24" cy="57" r="2.2" fill="#ffffff" opacity="0.75" />
    <circle cx="34" cy="59" r="1.5" fill="#ffffff" opacity="0.75" />

    <!-- Glass Flask Outer Wall -->
    <!-- Neck -->
    <path d="M 17,6 L 17,26 L 0,72 Q -2,78 5,78 L 43,78 Q 50,78 48,72 L 31,26 L 31,6" fill="url(#flaskGrad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Lip Collar -->
    <path d="M 14,5 L 34,5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Glass Reflection Highlights -->
    <path d="M 19,10 L 19,24 L 5,68" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Connecting Tubing / Process Line between Glassware -->
  <path d="M 166,165 Q 185,150 200,158 T 235,160" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7" />

  <!-- Prominent Central Banner: "LAMPE" -->
  <g transform="translate(0, 240)">
    <!-- Banner Plate -->
    <rect x="100" y="-12" width="200" height="42" rx="21" fill="#041224" stroke="url(#goldGrad)" stroke-width="2.5" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.6))" />
    
    <!-- Inner Glow -->
    <rect x="103" y="-9" width="194" height="36" rx="18" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />

    <!-- "LAMPE" Title Text -->
    <text x="200" y="17" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="27" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      LAMPE
    </text>
  </g>

  <!-- Small Tagline below LAMPE -->
  <text x="200" y="294" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="9" fill="#fcd34d" text-anchor="middle" letter-spacing="2">
    MATÉRIAUX • PROCÉDÉS • ENVIRONNEMENT
  </text>
</svg>
